# Deploys the Worker (API) and the Pages site (frontend) on every push to
# main. Requires the Cloudflare setup workflow to have been run once first,
# and wrangler.toml to carry the real D1 database_id.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Apply D1 schema
        working-directory: apps/worker
        run: npx wrangler d1 execute adivina-la-palabra --remote --file=./schema.sql --yes

      - name: Deploy Worker
        working-directory: apps/worker
        run: npx wrangler deploy

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Build frontend
        working-directory: apps/web
        # Firebase web config is public by design (it identifies the project,
        # it does not authorize anything), so these live in the workflow
        # rather than in secrets.
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDuw7d5RFGDJUoEQdgKJ7xqXLzb4ssPYQI
          VITE_FIREBASE_AUTH_DOMAIN: adivina-la-palabra-ligas.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: adivina-la-palabra-ligas
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set (should be the deployed Worker's URL)."
            exit 1
          fi
          npm run build

      - name: Deploy to Pages
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name=adivina-la-palabra --branch=main
