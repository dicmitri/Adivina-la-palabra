# Deploys the Worker (API) and the Pages site (frontend) on every push to
# main. Requires the Cloudflare setup workflow to have been run once first,
# and wrangler.toml to carry the real D1 database_id.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Apply D1 schema
        working-directory: apps/worker
        run: npx wrangler d1 execute adivina-la-palabra --remote --file=./schema.sql --yes

      # The frontend needs the Worker's URL at build time. Rather than keeping
      # it in a hand-maintained variable that silently goes stale, capture it
      # from the deploy output and hand it to the web job.
      - name: Deploy Worker
        id: deploy
        working-directory: apps/worker
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not determine the deployed Worker URL from wrangler output."
            exit 1
          fi
          echo "Worker URL: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Proves the deployed Worker actually serves traffic and that its auth
      # gate rejects unauthenticated calls — a successful upload alone does
      # not tell us either of those.
      - name: Smoke test the deployed Worker
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            health=$(curl -sS -m 15 "$url/api/health" || true)
            echo "attempt $i — /api/health: $health"
            if [ "$health" = '{"ok":true}' ]; then
              code=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$url/api/me" || true)
              echo "/api/me (no token) returned HTTP $code"
              if [ "$code" != "401" ]; then
                echo "::error::Expected 401 from /api/me without a token, got $code"
                exit 1
              fi
              echo "Worker is live and its auth gate works."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Worker did not return a healthy response at $url/api/health"
          exit 1

  deploy-web:
    runs-on: ubuntu-latest
    needs: deploy-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Build frontend
        working-directory: apps/web
        # Firebase web config is public by design (it identifies the project,
        # it does not authorize anything), so these live in the workflow
        # rather than in secrets.
        env:
          VITE_FIREBASE_API_KEY: AIzaSyDuw7d5RFGDJUoEQdgKJ7xqXLzb4ssPYQI
          VITE_FIREBASE_AUTH_DOMAIN: adivina-la-palabra-ligas.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: adivina-la-palabra-ligas
          VITE_API_BASE_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: npm run build

      - name: Deploy to Pages
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name=adivina-la-palabra --branch=main
